name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  analyze-and-test:
    name: Análisis estático y pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          # Fijada a propósito: el código usa Color.withValues(alpha:),
          # disponible desde Flutter 3.27. Una versión "latest" flotante
          # rompería la compilación sin avisar.
          flutter-version: '3.32.0'
          channel: stable
          cache: true

      - name: Descargar dependencias
        run: flutter pub get

      # Informativo y no bloqueante: el proyecto se edita también desde
      # equipos sin SDK de Dart instalado, donde no se puede ejecutar
      # `dart format` antes de subir. El resultado queda en el resumen para
      # aplicarlo en la siguiente pasada; lo que sí bloquea es el análisis
      # estático y las pruebas, que son las que detectan errores reales.
      - name: Revisar el formato del código (informativo)
        continue-on-error: true
        run: dart format --output=none --set-exit-if-changed lib test

      # `flutter analyze` trata los avisos de estilo como fatales por defecto;
      # con --no-fatal-infos siguen bloqueando los errores y las advertencias
      # reales (import sin usar, variable muerta, tipo incompatible) y las
      # sugerencias del linter quedan listadas sin tumbar la entrega.
      #
      # La salida se copia al resumen del job porque los registros completos
      # de Actions exigen iniciar sesión: así cualquiera que abra la ejecución
      # ve qué falló sin tener acceso al repositorio.
      - name: Análisis estático
        run: |
          set +e
          flutter analyze --no-fatal-infos 2>&1 | tee analyze.log
          status=${PIPESTATUS[0]}
          {
            echo '### Análisis estático'
            echo ''
            echo '```text'
            tail -n 300 analyze.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: Pruebas con cobertura
        run: |
          set +e
          flutter test --coverage 2>&1 | tee test.log
          status=${PIPESTATUS[0]}
          {
            echo '### Pruebas'
            echo ''
            echo '```text'
            tail -n 300 test.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # Además del resumen, el primer fallo se emite como anotación: las
          # anotaciones son públicas vía API y el registro completo no, así que
          # esto es lo que permite diagnosticar sin acceso al repositorio.
          if [ "$status" -ne 0 ]; then
            encode() { tr -d '\r' | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}'; }
            first="$(grep -m1 -A 60 -E '❌|✖|EXCEPTION CAUGHT' test.log | encode)"
            last="$(tail -n 120 test.log | encode)"
            echo "::error title=Primer fallo::${first}"
            echo "::error title=Final del registro::${last}"
          fi
          exit $status

      - name: Publicar el reporte de cobertura
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: warn

  validate-content:
    name: Validación del catálogo geológico
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validar integridad del contenido
        run: python tool/validate_content.py
