name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  analyze-and-test:
    name: Análisis estático y pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          # Fijada a propósito: el código usa Color.withValues(alpha:),
          # disponible desde Flutter 3.27. Una versión "latest" flotante
          # rompería la compilación sin avisar.
          flutter-version: '3.32.0'
          channel: stable
          cache: true

      - name: Descargar dependencias
        run: flutter pub get

      - name: Verificar el formato del código
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Análisis estático
        run: flutter analyze --fatal-infos

      - name: Pruebas con cobertura
        run: flutter test --coverage

      - name: Publicar el reporte de cobertura
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: warn

  validate-content:
    name: Validación del catálogo geológico
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validar integridad del contenido
        run: python tool/validate_content.py
