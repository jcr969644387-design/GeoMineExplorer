name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      build_mode:
        description: 'Tipo de compilación'
        required: true
        default: 'release'
        type: choice
        options: [release, debug]

jobs:
  build:
    name: Compilar APK de Android
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: stable
          cache: true

      # La carpeta android/ no se versiona a propósito: se genera aquí con la
      # misma versión de Flutter que compila. El script además fija el nombre
      # visible de la aplicación y genera el icono del lanzador.
      - name: Generar el proyecto Android
        run: bash tool/bootstrap.sh

      # Un solo APK universal. NO se usa --split-per-abi: esa opción genera un
      # APK por arquitectura y, al subirlos todos juntos, el archivo descargado
      # contenía cuatro APK y no estaba claro cuál instalar.
      - name: Compilar el APK universal
        run: flutter build apk --${{ inputs.build_mode || 'release' }}

      - name: Renombrar el APK con la versión de la entrega
        id: apk
        run: |
          set -euo pipefail
          mode="${{ inputs.build_mode || 'release' }}"
          version="$(sed -n 's/^version: *//p' pubspec.yaml | head -n1 | cut -d'+' -f1)"
          artifact="GeoMineExplorerV${version}"
          out="build/app/outputs/flutter-apk"

          # Red de seguridad: si alguna vez vuelve a colarse --split-per-abi,
          # aquí aparecen varios APK y la compilación falla en lugar de
          # publicar un paquete confuso.
          count="$(find "$out" -maxdepth 1 -name '*.apk' | wc -l)"
          if [ "$count" -ne 1 ]; then
            echo "Se esperaba un único APK y se encontraron $count:" >&2
            find "$out" -maxdepth 1 -name '*.apk' >&2
            exit 1
          fi

          mkdir -p dist
          cp "$out/app-${mode}.apk" "dist/${artifact}.apk"
          echo "artifact=${artifact}" >> "$GITHUB_OUTPUT"
          ls -lh dist

      - name: Publicar el APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.artifact }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Adjuntar el APK a la release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
